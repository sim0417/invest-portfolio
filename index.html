<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>투자 포트폴리오</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="포트폴리오">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14171c;--sub:#6b7280;--line:#e5e7eb;--pos:#d6336c;--neg:#1c7ed6;--ok:#2f9e44;--warn:#e8590c;--bad:#e03131;--accent:#3b5bdb;--chip:#eef1f6}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d10;--card:#16191e;--ink:#eef0f3;--sub:#9aa3af;--line:#262b33;--pos:#ff6b8b;--neg:#5aa9ff;--ok:#51cf66;--warn:#ff922b;--bad:#ff6b6b;--accent:#748ffc;--chip:#20252c}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;display:flex;justify-content:space-between;align-items:center}
header small{color:var(--sub);font-weight:400;font-size:12px}
main{padding:12px 16px 96px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--sub);padding:10px 0 12px;font-size:12px}
nav button b{display:block;font-size:18px;line-height:1.2}
nav button.on{color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:26px;font-weight:700;letter-spacing:-.5px}
.lbl{color:var(--sub);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);gap:12px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--sub)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:var(--chip);color:var(--sub);margin:2px 4px 2px 0}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.bad{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tk{font-weight:700}
.bar{position:relative;height:8px;background:var(--chip);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:4px}
.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.6}
.hold{padding:12px 0;border-bottom:1px solid var(--line)}
.hold:last-child{border-bottom:0}
.note{color:var(--sub);font-size:12px;margin-top:6px}
.alert{border-color:var(--warn)}
.alert.bad{border-color:var(--bad)}
form label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px 0;border-radius:8px;color:var(--sub);font-size:13px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600}
.btn{width:100%;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:600;background:var(--accent);color:#fff;margin-top:14px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn:disabled{opacity:.5}
.msg{margin-top:10px;font-size:13px;white-space:pre-wrap}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
svg{width:100%;height:auto;display:block}
.small{font-size:12px}
.hidden{display:none}
#loading{color:var(--sub);text-align:center;padding:40px 0}
/* ── PC 레이아웃 (1100px 이상): 탭 없이 한 화면 */
table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.t th{color:var(--sub);font-weight:500;font-size:12px;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
table.t td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover td{background:var(--chip)}
table.t tr.sum td{font-weight:700;border-top:2px solid var(--line)}
table.t td.l{text-align:left}
.wbar{position:relative;width:110px;height:8px;background:var(--chip);border-radius:4px;display:inline-block;vertical-align:middle;margin-right:6px}
.wbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:4px}
.wbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.6}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpis .card{margin:0}
.kpis .big{font-size:22px}
.scroll{max-height:420px;overflow:auto}
.tw{overflow:auto}
.desk{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.desk .card{margin:0}
.desk>*:not(.side){grid-column:1}
.desk .side{grid-column:2;grid-row:1/span 20;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.desk .side .card{margin-bottom:12px}
@media (min-width:1500px){
  .desk{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) 400px}
  .desk>*:not(.side){grid-column:auto}
  .desk>.span2{grid-column:1/3}
  .desk .side{grid-column:3}
}
.desk h2{font-size:14px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.desk h2 small{color:var(--sub);font-weight:400;font-size:12px}
@media (min-width:1100px){
  main{max-width:1720px;padding:16px 24px 32px}
  nav{display:none!important}
  header{padding:14px 24px 10px}
}
</style>
</head>
<body>
<header><h1>투자 포트폴리오 <small><span id="stamp"></span> <a href="#" id="logout" class="hidden" style="color:var(--sub)">로그아웃</a></small></h1></header>
<main>
  <div id="loading">불러오는 중…</div>
  <section id="login" class="hidden"><div class="card"><div class="lbl">본인 확인</div><button class="btn" id="gLogin">Google 계정으로 로그인</button><div class="note">허용된 계정(개인·회사)만 열립니다. 로그인은 Google 정책상 1시간 유지되고, 다시 누르면 지난 계정으로 바로 이어집니다.</div><div id="pwMsg" class="msg bad"></div></div></section>
  <section id="tab-sum" class="hidden"></section>
  <section id="tab-hold" class="hidden"></section>
  <section id="tab-reb" class="hidden"></section>
  <section id="tab-perf" class="hidden"></section>
  <section id="tab-in" class="hidden"></section>
  <section id="desk" class="hidden desk"></section>
  <div class="note" id="ver" style="text-align:center;margin-top:16px"></div>
</main>
<nav>
  <button data-t="sum" class="on"><b>◎</b>요약</button>
  <button data-t="hold"><b>▤</b>보유</button>
  <button data-t="reb"><b>⇄</b>리밸런싱</button>
  <button data-t="perf"><b>↗</b>성과</button>
  <button data-t="in"><b>＋</b>입력</button>
</nav>
<script>
var D = null, TAB = 'sum', FLASH = null;
// ── 연결 설정: 모두 공개 식별자(비밀 아님). 데이터는 허용된 계정으로 로그인해야만 Apps Script에서 내려온다.
var CFG = {
  clientId: '1005314406530-kn7geuh12ug67veio0mpnm07hsl9atbo.apps.googleusercontent.com',
  scriptId: 'AKfycbzeMnfzN6hZ9FNJT8UOVfALuq00CRnvBtBC0lV2tmR1SWJjSMzdYSJ0jF59cKTqclTS0g',  // API 실행 파일 배포 ID
  scopes: 'https://www.googleapis.com/auth/script.scriptapp https://www.googleapis.com/auth/script.external_request https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/spreadsheets.currentonly'
};
var TOK = null, tokenClient = null, pendingAfterLogin = null, SESSION = 0;
var UI_VERSION = 'v9.4';
// 액세스 토큰은 Google이 1시간짜리로만 준다(리프레시 토큰은 서버 없이 받을 수 없음). 그 1시간 동안은 새로고침·새 탭에서도 유지되게 localStorage에 두고,
// 만료되면 마지막 계정(login_hint)으로 한 번 눌러 다시 받는다. 로그아웃하면 지운다. (보안 검토 V9-05: 같은 origin JS가 읽을 수 있는 잔여 위험은 사용자 편의를 위해 수용)
try { sessionStorage.removeItem('pfTok'); var t = JSON.parse(localStorage.getItem('pfTok') || 'null'); if (t && t.exp > Date.now() + 60000) TOK = t; } catch (e) {}
function saveTok(t){TOK=t;try{if(t)localStorage.setItem('pfTok',JSON.stringify(t));else localStorage.removeItem('pfTok')}catch(e){}}
function lastUser(){try{return localStorage.getItem('pfUser')||''}catch(e){return ''}}
function login(){if(!initGis())return false;var u=lastUser();tokenClient.requestAccessToken(u?{prompt:'',login_hint:u}:{prompt:''});return true}
function authKind(status,m){m=String(m);if(/AUTH_DENIED/.test(m))return 'denied';if(status===401||/UNAUTHENTICATED|invalid authentication|invalid_token|Invalid Credentials/i.test(m))return 'expired';if(status===403||/PERMISSION_DENIED/.test(m))return 'forbidden';return ''}
function clearData(){D=null;['sum','hold','reb','perf','in'].forEach(function(k){$('tab-'+k).innerHTML=''});$('desk').innerHTML='';$('stamp').textContent=''}
function showLogin(msg){clearData();SUBMITTING=false;ACTIVE=null;['sum','hold','reb','perf','in'].forEach(function(k){$('tab-'+k).classList.add('hidden')});$('desk').classList.add('hidden');$('loading').classList.add('hidden');$('login').classList.remove('hidden');document.querySelector('nav').classList.add('hidden');$('logout').classList.add('hidden');$('pwMsg').textContent=msg?String(msg).replace(/^.*AUTH_DENIED: ?/,''):''}
function initGis(){
  if(tokenClient||!(window.google&&google.accounts&&google.accounts.oauth2))return !!tokenClient;
  tokenClient=google.accounts.oauth2.initTokenClient({client_id:CFG.clientId,scope:CFG.scopes,
    callback:function(r){
      if(r.error){pendingAfterLogin=null;showLogin('로그인 실패: '+r.error);return}
      if(!google.accounts.oauth2.hasGrantedAllScopes.apply(null,[r].concat(CFG.scopes.split(' ')))){pendingAfterLogin=null;showLogin('권한을 일부만 허용했습니다. 로그인 창의 권한 항목을 모두 허용해야 시트를 읽고 쓸 수 있습니다.');return}
      SESSION++;saveTok({access_token:r.access_token,exp:Date.now()+(Number(r.expires_in)||3600)*1000});
      var f=pendingAfterLogin;pendingAfterLogin=null;if(f)f();else load();
    },
    error_callback:function(e){pendingAfterLogin=null;if(!D)showLogin('로그인 창이 닫혔거나 열리지 않았습니다'+(e&&e.type?' ('+e.type+')':'')+'. 팝업 차단을 확인하고 다시 눌러 주세요.')}
  });
  return true;
}
// 서버 함수 호출: Apps Script API scripts.run (호출한 계정으로 실행된다)
// opts.minMs: 토큰 남은 시간이 이보다 짧으면 호출하지 않는다(긴 쓰기 도중 만료 방지). opts.onReauth(retry)가 있으면 재로그인 후 이어서 실행.
function srv(fn, args, ok, fail, opts){
  var need=(opts&&opts.minMs)||30000, fin=function(){if(opts&&opts.always)try{opts.always()}catch(e){}};   // always: 어떤 경로로 끝나든 호출(입력 잠금 해제용)
  if(!TOK||TOK.exp<Date.now()+need){
    fin();
    if(TOK&&opts&&opts.onReauth){opts.onReauth(function(){srv(fn,args,ok,fail,opts)});return}
    saveTok(null);showLogin('로그인이 만료됐습니다. 다시 로그인해 주세요.');return;
  }
  var g=SESSION;   // 로그아웃·계정 전환 뒤 늦게 온 응답은 버린다
  fetch('https://script.googleapis.com/v1/scripts/'+CFG.scriptId+':run',{method:'POST',headers:{'Authorization':'Bearer '+TOK.access_token,'Content-Type':'application/json'},body:JSON.stringify({'function':fn,parameters:args||[],devMode:false})})
    .then(function(r){return r.json().catch(function(){return {error:{message:'HTTP '+r.status}}}).then(function(j){return {status:r.status,j:j}})},
          function(e){throw {network:true,message:'네트워크 오류: '+(e&&e.message||e)}})
    .then(function(x){
      fin();
      if(g!==SESSION)return;
      var j=x.j;
      if(j.error){var det=(j.error.details&&j.error.details[0])||{};var m=det.errorMessage||j.error.message||('HTTP '+x.status);
        var k=authKind(x.status,m);
        if(k==='expired'){saveTok(null);showLogin('로그인이 만료됐습니다. 다시 로그인해 주세요.');return}
        if(k==='denied'){saveTok(null);showLogin(m);return}
        if(k==='forbidden'){saveTok(null);showLogin('권한이 없습니다: '+m+'\n(회사 계정이면 조직 정책이 외부 앱을 막았을 수 있습니다. 시트 공유 권한도 확인하세요.)');return}
        if(fail)fail({message:'서버 오류: '+m});return}
      var res=j.response?j.response.result:undefined;
      if(res===undefined||res===null){if(fail)fail({message:'서버 응답이 비어 있습니다. 새로고침 후 다시 확인하세요.'});return}
      try{ok(res)}catch(e){if(window.console)console.error(e);if(fail)fail({message:'화면 처리 오류: '+(e&&e.message||e)})}
    })
    .catch(function(e){fin();if(g!==SESSION)return;if(fail)fail(e&&e.network?e:{message:'오류: '+(e&&e.message||e)})});
}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function num(v){return typeof v==='number'&&isFinite(v)}
function krw(v){return num(v)?Math.round(v).toLocaleString('ko-KR')+'원':esc(v||'N/A')}
function usd(v){return num(v)?'$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):esc(v||'N/A')}
function pct(v,d){return num(v)?(v*100).toFixed(d==null?2:d)+'%':esc(v||'N/A')}
function spct(v){return num(v)?(v>0?'+':'')+(v*100).toFixed(2)+'%':esc(v||'N/A')}
function cls(v){return num(v)?(v>0?'pos':v<0?'neg':''):''}
function sh(v){return num(v)?(+v.toFixed(6)).toString():esc(v)}
function chip(text){var t=String(text||'');var c=/^(OK|COMPLETE|DELAYED|EXACT|ACTIVE|true)/.test(t)?'ok':/(ERROR|MISSING|INCOMPLETE|BROKEN|RECONCILIATION|N\/A|MISMATCH)/.test(t)?'bad':/(STALE|PROVISIONAL|APPROX|UNVERIFIED|MANUAL|PENDING|REVISED|EXIT|OVER|UNDER|NOT_STARTED|WARN)/.test(t)?'warn':'';return '<span class="chip '+c+'">'+esc(t)+'</span>'}

function load(){
  if(!TOK){showLogin('');return}
  $('login').classList.add('hidden');$('loading').classList.remove('hidden');
  srv('webGetDashboard',[],function(d){D=d;$('loading').classList.add('hidden');document.querySelector('nav').classList.remove('hidden');$('logout').classList.remove('hidden');render()},function(e){$('loading').textContent='불러오기 실패: '+(e&&e.message||e)});
}
$('gLogin').onclick=function(){$('pwMsg').textContent='';if(!login())$('pwMsg').textContent='로그인 모듈을 불러오는 중입니다. 잠시 뒤 다시 눌러 주세요.'};
$('logout').onclick=function(e){e.preventDefault();SESSION++;try{localStorage.removeItem('pfUser')}catch(x){}if(TOK&&window.google&&google.accounts)google.accounts.oauth2.revoke(TOK.access_token,function(){});saveTok(null);showLogin('')};
function show(t){TAB=t;['sum','hold','reb','perf','in'].forEach(function(k){$('tab-'+k).classList.toggle('hidden',k!==t)});document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});window.scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){show(b.dataset.t)}});

var DESK_MQ=window.matchMedia?window.matchMedia('(min-width:1100px)'):{matches:false};
function isDesk(){return DESK_MQ.matches}
if(DESK_MQ.addEventListener)DESK_MQ.addEventListener('change',function(){if(D)render()});
function render(){
  $('stamp').textContent='조회 '+D.now+(D.user?' · '+D.user:'');
  try{if(D.user)localStorage.setItem('pfUser',D.user)}catch(e){}
  if(isDesk()){
    ['sum','hold','reb','perf','in'].forEach(function(k){$('tab-'+k).innerHTML='';$('tab-'+k).classList.add('hidden')});
    renderDesk();renderIn();$('desk').classList.remove('hidden');
  }else{
    $('desk').innerHTML='';$('desk').classList.add('hidden');
    renderSum();renderHold();renderReb();renderPerf();renderIn();show(TAB);
  }
  $('ver').textContent='화면 '+UI_VERSION+' · 서버 '+(D.apiVersion||'?');
  Object.keys(PEND).forEach(function(k){if(PEND[k]&&PEND[k].unsure&&k===MODE)checkPending(k)});
  if(FLASH&&$(FLASH.id)){$(FLASH.id).className='msg '+FLASH.c;$(FLASH.id).textContent=FLASH.t}FLASH=null;
}

function statusCard(){
  var p=D.perf, integ=p['Reference Integrity'], ps=p['Performance Status'];
  var bad=D.ledgerErrors>0||D.quality==='LEDGER_ERROR'||D.quality==='INCOMPLETE'||(integ&&integ!=='OK');
  var warn=!bad&&(D.quality!=='COMPLETE'||ps==='APPROX'||ps==='PROVISIONAL'||D.strategyStatus!=='OK');
  var h='<div class="card '+(bad?'alert bad':warn?'alert':'')+'"><div class="lbl">상태</div><div style="margin-top:4px">'
    +chip('데이터 '+D.quality)+chip('원장 오류 '+D.ledgerErrors)+chip(D.accountVerified?'계좌 대조 완료':'계좌 대조 전')+chip('성과 '+ps)+chip('무결성 '+integ)+chip('전략 '+D.strategyStatus)+'</div>';
  if(D.quality!=='COMPLETE')h+='<div class="note">'+esc(D.qualityDetail)+'</div>';
  if(integ&&integ!=='OK')h+='<div class="note">'+esc(p['TX Integrity (script)']||'')+' → 입력 탭에서 확인</div>';
  h+='<div class="note">시세: 마지막 시도 '+esc(D.lastAttempt)+' · 마지막 정상 '+esc(D.lastRefresh)+(D.lastResult?' · '+esc(D.lastResult):'')+' · 지연 시세(정규장)</div></div>';
  return h;
}
function renderSum(){
  var p=D.perf, twr=p['TWR (개시 이후 누적)'], dd=p['Current Drawdown'], gp=p['목표 달성률 (TWR ÷ 기본목표)'];
  var h=statusCard();
  h+='<div class="card"><div class="lbl">총 투자자산 (NAV)</div><div class="big">'+krw(D.nav)+'</div>'
    +'<div class="note">주식 '+krw(D.stocks)+' · 현금 '+krw(D.cashKrwTotal)+' ('+pct(D.cashWeight,1)+', 목표 '+pct(D.cashTarget,0)+')</div></div>';
  h+='<div class="grid"><div class="card"><div class="lbl">개시 이후 TWR</div><div class="big '+cls(twr)+'">'+spct(twr)+'</div><div class="note">목표 +'+pct(D.baseGoal,0)+' · 달성률 '+pct(gp,1)+'</div></div>'
    +'<div class="card"><div class="lbl">낙폭</div><div class="big '+cls(dd)+'">'+spct(dd)+'</div><div class="note">최대 '+spct(p['Max Drawdown (관측기간)'])+'</div></div></div>';
  h+='<div class="card"><div class="kv"><span>미실현손익 (원가 대비)</span><span class="'+cls(D.unrealized)+'">'+krw(D.unrealized)+' ('+spct(D.unrealizedRet)+')</span></div>'

  document.querySelectorAll('.seg button').forEach(function(b){b.onclick=function(){if(SUBMITTING)return;MODE=b.dataset.m;form()}});
  $('refBtn').onclick=function(){op('webRefresh',this)};
  $('snapBtn').onclick=function(){op('webSnapshot',this)};
  form();
  if(integ&&integ!=='OK'){srv('webGetRevision',[],function(r){$('revDetail').textContent=r.detail||r.status;var b=$('ackBtn');if(r.status==='TX_REVISED'){b.disabled=false;b.onclick=function(){b.disabled=true;srv('webAcknowledge',[r.key],function(x){$('ackMsg').className='msg '+(x.ok?'ok':'bad');$('ackMsg').textContent=x.ok?'승인했습니다.':x.error;if(x.ok){FLASH={id:'opMsg',c:'ok',t:'과거 거래 정정을 승인했습니다.'};load()}},fail('ackMsg',b))}}else{b.textContent='승인 대상 아님 ('+r.status+')'}})}
}
function opt(list,sel){return list.map(function(v){return '<option'+(v===sel?' selected':'')+'>'+esc(v)+'</option>'}).join('')}
function form(){
  document.querySelectorAll('.seg button').forEach(function(b){b.classList.toggle('on',b.dataset.m===MODE)});
  var f=$('f'), h='';
  if(MODE==='trade'){
    h='<label>체결 일시 (KST)</label><input id="i_date" type="datetime-local" value="'+nowLocal()+'">'
      +'<div class="grid"><div><label>종목</label><select id="i_tk">'+opt(D.tickers)+'</select></div><div><label>구분</label><select id="i_ty"><option>BUY</option><option>SELL</option></select></div></div>'
      +'<div class="grid"><div><label>수량</label><input id="i_sh" type="number" inputmode="decimal" step="any"></div><div><label>주당 가격 (USD)</label><input id="i_px" type="number" inputmode="decimal" step="any"></div></div>'
      +'<div class="grid"><div><label>체결 환율 (원/$)</label><input id="i_fx" type="number" inputmode="decimal" step="any" value="'+(num(D.fx)?D.fx.toFixed(2):'')+'"></div><div><label>수수료 (USD)</label><input id="i_fee" type="number" inputmode="decimal" step="any" value="0"></div></div>'
      +'<label>메모</label><input id="i_memo" placeholder="선택">'
      +'<div class="note">환율은 지금 시트 값으로 채워져 있습니다. 증권사 체결 환율을 알면 고쳐 주세요.</div><button class="btn" id="go">기록</button>';
  }else if(MODE==='flow'){
    h='<div class="grid"><div><label>통화</label><select id="i_cur"><option>KRW</option><option>USD</option></select></div><div><label>구분</label><select id="i_dir"><option value="1">입금</option><option value="-1">출금</option></select></div></div>'
      +'<label>금액</label><input id="i_amt" type="number" inputmode="decimal" step="any">'
      +'<label>메모</label><input id="i_memo" placeholder="선택">'
      +'<div class="note">'+(D.hasStart?'지금 시각으로 기록하고 직전·직후 스냅샷을 남겨 TWR 구간을 나눕니다(1분 안팎). 시세·데이터 상태에 따라 구간이 APPROX(근사)로 표시될 수 있습니다.':'개시 기준점 확정 전이라 현금만 기록하고 성과 스냅샷은 남기지 않습니다.')+'</div><button class="btn" id="go">기록</button>';
  }else{
    h='<label>유형</label><select id="i_ty"><option value="DIVIDEND">배당 (+)</option><option value="INTEREST">이자 (+)</option><option value="TAX">세금 (−)</option><option value="FEE">수수료 (−)</option><option value="FX">환전</option></select>'
      +'<label>일시 (KST)</label><input id="i_date" type="datetime-local" value="'+nowLocal()+'">'
      +'<div class="grid"><div><label id="l_cur">통화</label><select id="i_cur"><option>USD</option><option>KRW</option></select></div><div><label id="l_amt">금액</label><input id="i_amt" type="number" inputmode="decimal" step="any"></div></div>'
      +'<div id="fxTo" class="hidden"><label id="l_to">받은 금액</label><input id="i_to" type="number" inputmode="decimal" step="any"></div>'
      +'<label>메모</label><input id="i_memo" placeholder="선택">'
      +'<div class="note">금액은 양수로 입력하면 유형에 맞춰 부호가 붙습니다. 환전은 보낸 통화·금액과 받은 금액을 넣습니다.</div><button class="btn" id="go">기록</button>';
  }
  f.innerHTML=h; $('fmsg').textContent='';
  var dr=DRAFT[MODE];Object.keys(dr).forEach(function(id){if($(id))$(id).value=dr[id]});
  f.oninput=f.onchange=function(ev){var el=ev.target;if(el&&el.id)DRAFT[MODE][el.id]=el.value};
  if(MODE==='cash'){var up=function(){var fx=$('i_ty').value==='FX';$('fxTo').classList.toggle('hidden',!fx);$('l_cur').textContent=fx?'보낸 통화':'통화';$('l_amt').textContent=fx?'보낸 금액':'금액';$('l_to').textContent='받은 금액 ('+($('i_cur').value==='USD'?'KRW':'USD')+')'};$('i_ty').onchange=up;$('i_cur').onchange=up;up()}
  $('go').onclick=submit;
}
function fail(id,btn){return function(e){if(btn)btn.disabled=false;$(id).className='msg bad';$(id).textContent=e&&e.message||String(e)}}
function done(id,btn,okText){return function(r){if(btn)btn.disabled=false;$(id).className='msg '+(r.ok?'ok':'bad');var t=r.ok?(okText(r)+(r.replayed?'\n(이미 기록된 요청이라 다시 쓰지 않았습니다)':'')):r.error;if(r.ok&&r.integrity&&r.integrity.status!=='OK')t+='\n⚠ '+r.integrity.status+': '+r.integrity.detail;$(id).textContent=t;if(r.ok){FLASH={id:id,c:'ok',t:t};load()}}}
// 쓰기 요청: 제출 건마다 요청 ID를 하나 만들고, 같은 내용의 재시도(응답 유실·BUSY·재로그인)는 같은 ID로 보낸다 → 서버가 중복 기록하지 않는다.
var DRAFT={trade:{},flow:{},cash:{}}, PEND={}, SUBMITTING=false;
function rid(){var r=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12));return r.replace(/[^A-Za-z0-9-]/g,'')}
function reqFor(kind,payload){var fp=JSON.stringify(payload),p=PEND[kind];if(!p||p.fp!==fp)p=PEND[kind]={fp:fp,id:rid()};return {requestId:p.id,payload:payload}}
function msg(id,c,t){$(id).className='msg '+(c||'');$(id).textContent=t}
function reauth(id,retry){
  $(id).className='msg bad';$(id).innerHTML='로그인 남은 시간이 짧아 이대로 보내면 도중에 끊길 수 있습니다. <button class="btn" id="reBtn">다시 로그인하고 이어서 기록</button>';
  $('reBtn').onclick=function(){pendingAfterLogin=retry;if(!login()){pendingAfterLogin=null;msg(id,'bad','로그인 모듈을 불러오는 중입니다. 잠시 뒤 다시 눌러 주세요.')}};
}
// 지울 요청 ID가 지금 슬롯의 요청과 같을 때만 지운다(늦게 온 다른 요청의 응답이 새 요청 상태를 지우지 않게)
function committed(kind,id){if(!PEND[kind]||PEND[kind].id!==id)return false;delete PEND[kind];DRAFT[kind]={};return true}
var CHECKING={};
var ACTIVE=null;
function writeCall(fn,kind,payload,okText,minMs,busyText){
  var req=reqFor(kind,payload),me=rid(),btn=$('go');ACTIVE=me;SUBMITTING=true;PEND[kind].unsure=true;if(btn)btn.disabled=true;msg('fmsg','',busyText||'기록 중…');
  var end=function(){if(ACTIVE!==me)return;ACTIVE=null;SUBMITTING=false;var b=$('go');if(b)b.disabled=false};   // 이 요청이 잡은 잠금만 푼다
  srv(fn,[req],function(r){if(PEND[kind]&&PEND[kind].id===req.requestId)PEND[kind].unsure=false;if(r.ok)committed(kind,req.requestId);done('fmsg',null,okText)(r)},
    function(e){
      if(!e.network){if(PEND[kind]&&PEND[kind].id===req.requestId)PEND[kind].unsure=false;msg('fmsg','bad',e.message);return}
      msg('fmsg','','응답을 받지 못했습니다. 기록됐는지 확인 중…');
      checkPending(kind);
    },
    {minMs:minMs,always:end,onReauth:function(retry){reauth('fmsg',function(){writeCall(fn,kind,payload,okText,minMs,busyText)})}});
}
// 결과를 모르는 요청(응답 유실·도중 로그아웃·인증 만료)은 다시 보내기 전에 원장에 기록됐는지 먼저 확인한다
function checkPending(kind){
  var p=PEND[kind];if(!p||CHECKING[kind])return;
  var id=p.id,mine=function(){return PEND[kind]&&PEND[kind].id===id};
  CHECKING[kind]=true;   // 확인이 끝날 때까지 같은 입력 모드의 새 제출을 막는다
  srv('webGetRequest',[id],function(c){
    CHECKING[kind]=false;
    if(!mine())return;   // 그새 다른 요청으로 바뀌었으면 이 응답은 버린다
    if(c.committed){committed(kind,id);FLASH=null;if($('fmsg'))msg('fmsg','ok','앞서 보낸 기록이 반영돼 있습니다: '+(c.res&&(c.res.msg||c.res.id)||''));load()}
    else{PEND[kind].unsure=false;if($('fmsg'))msg('fmsg','bad','앞서 보낸 기록은 반영되지 않았습니다. 같은 내용으로 다시 누르면 중복 없이 처리됩니다.')}
  },function(e2){CHECKING[kind]=false;if(mine()&&$('fmsg'))msg('fmsg','bad','기록 여부를 확인하지 못했습니다('+e2.message+'). 같은 내용으로 다시 누르면 중복 없이 처리됩니다.')},
  {always:function(){CHECKING[kind]=false}});
}
function submit(){
  if(SUBMITTING)return;
  if(CHECKING[MODE]){msg('fmsg','','앞서 보낸 기록을 확인하는 중입니다. 잠시 뒤 다시 눌러 주세요.');return}
  var v=function(id){var e=$(id);return e?e.value:''};
  if(MODE==='trade'){
    var t={date:v('i_date'),ticker:v('i_tk'),type:v('i_ty'),shares:v('i_sh'),price:v('i_px'),currency:'USD',fx:v('i_fx'),fee:v('i_fee'),memo:v('i_memo')};
    if(!confirm(t.ticker+' '+t.type+' '+t.shares+'주 @ $'+t.price+' (환율 '+t.fx+')\n기록할까요?'))return;
    writeCall('webAddTrade','trade',t,function(r){return '기록했습니다: '+r.id+(num(r.realized)?' · 실현손익 '+krw(r.realized):'')},3*60000);
  }else if(MODE==='flow'){
    var amt=Number(v('i_amt'))*Number(v('i_dir')), cur=v('i_cur');
    if(!amt){msg('fmsg','bad','금액을 입력하세요.');return}
    if(!confirm('외부 '+(amt>0?'입금':'출금')+' '+(cur==='USD'?usd(Math.abs(amt)):krw(Math.abs(amt)))+'\n기록할까요?'))return;
    writeCall('webExternalFlow','flow',{currency:cur,amount:amt,note:v('i_memo')},function(r){return r.msg},8*60000,'기록 중… (스냅샷 포함 1분 안팎)');
  }else{
    var e={type:v('i_ty'),date:v('i_date'),currency:v('i_cur'),amount:v('i_amt'),toAmount:v('i_to'),note:v('i_memo')};
    if(!confirm(e.type+' '+e.currency+' '+e.amount+(e.type==='FX'?' → '+e.toAmount:'')+'\n기록할까요?'))return;
    writeCall('webAddCash','cash',e,function(r){return '기록했습니다: '+r.id},3*60000);
  }
}
function op(fn,btn){btn.disabled=true;msg('opMsg','','실행 중…');srv(fn,[],done('opMsg',btn,function(r){return r.msg}),fail('opMsg',btn),{minMs:3*60000})}
load();
</script>
</body>
</html>
